<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plumb Line Posture</title>
<meta name="description" content="Posture and range-of-motion screening for the clinic iPad.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D6680">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plumb Line">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: clinical instrument — a top bar, one working column; on iPad landscape the photo canvas and its readings sit side by side, plumb line vermilion is the only loud colour. */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --sunk:#E3E9EB; --ink:#13212A; --muted:#566872; --line:#CBD6DA;
  --accent:#0D6680; --accent-ink:#FFFFFF; --plumb:#D2461E;
  --ok:#2C8A4B; --warn:#B87D00; --bad:#C23A2E;
  --ok-bg:#E2F2E7; --warn-bg:#FBF0D6; --bad-bg:#F8E1DE;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-data:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1418; --surface:#152027; --sunk:#0A1014; --ink:#E4ECEF; --muted:#93A4AD; --line:#2A3943;
  --accent:#4DB2D0; --accent-ink:#06222C; --plumb:#FF7A4D;
  --ok:#4CC274; --warn:#E6B13C; --bad:#F2695B;
  --ok-bg:#16301F; --warn-bg:#33290F; --bad-bg:#3A1A17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#152027; --sunk:#0A1014; --ink:#E4ECEF; --muted:#93A4AD; --line:#2A3943;
  --accent:#4DB2D0; --accent-ink:#06222C; --plumb:#FF7A4D;
  --ok:#4CC274; --warn:#E6B13C; --bad:#F2695B;
  --ok-bg:#16301F; --warn-bg:#33290F; --bad-bg:#3A1A17; color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;white-space:nowrap}
.brand svg{flex:none}
.bar .spacer{flex:1}
.crumb{color:var(--muted);font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;min-height:44px;
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:10px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.9rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.btn input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn{position:relative}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head>div{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}

/* patient rows */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface);text-align:left;width:100%;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .name{font-weight:600;font-size:1.05rem}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--accent);flex:none}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.badge.ex{background:color-mix(in srgb,var(--plumb) 16%,transparent);color:var(--plumb)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.none{background:var(--line)}

/* chips / tabs */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .tick{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;opacity:.5}
.chip .tick.done{background:var(--ok);border-color:var(--ok);opacity:1}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;align-self:flex-start;flex-wrap:wrap}
.tab{appearance:none;border:0;background:transparent;border-radius:999px;padding:9px 18px;min-height:40px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.editor{grid-template-columns:1fr}}
.stage{background:var(--sunk);border-radius:var(--r);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;min-height:320px;position:relative;overflow:hidden}
.stage canvas{display:block;touch-action:none;max-width:100%}
.stage .placeholder{padding:30px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center;max-width:420px}
.status-line{font-size:.85rem;color:var(--muted);min-height:1.3em}
.status-line.warnmsg{color:var(--warn)}

/* readings table */
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.v{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto;min-width:0}
.tscroll table{min-width:480px}

/* ROM list */
.romgroups{display:flex;flex-direction:column;gap:14px}
.romgroup{display:flex;flex-direction:column;gap:8px}
.romitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.romitem{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:56px}
.romitem[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.romitem .rv{font-family:var(--f-data);font-size:.85rem;color:var(--muted)}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-grid figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.compare-grid canvas{width:100%;height:auto;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.up{color:var(--ok);font-weight:600} .down{color:var(--bad);font-weight:600}

.note{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.9rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.row,.btn,.chip{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <button class="btn ghost" id="backBtn" hidden aria-label="Back">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="brand">
    <svg width="22" height="30" viewBox="0 0 22 30" aria-hidden="true"><line x1="11" y1="1" x2="11" y2="17" stroke="var(--plumb)" stroke-width="2"/><path d="M5 17h12l-6 12z" fill="var(--plumb)"/></svg>
    Plumb Line
  </div>
  <div class="crumb" id="crumb"></div>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="settingsBtn">Settings</button>
</div></header>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ============================================================
   Landmark model (MediaPipe Pose indices)
   ============================================================ */
const MP={nose:0,leye:2,reye:5,lear:7,rear:8,lsh:11,rsh:12,lel:13,rel:14,lwr:15,rwr:16,lhip:23,rhip:24,lkn:25,rkn:26,lank:27,rank:28};
const PT_LABEL={nose:"Nose",leye:"L eye",reye:"R eye",lear:"L ear",rear:"R ear",lsh:"L shoulder",rsh:"R shoulder",lel:"L elbow",rel:"R elbow",
  lwr:"L wrist",rwr:"R wrist",lhip:"L hip",rhip:"R hip",lkn:"L knee",rkn:"R knee",lank:"L ankle",rank:"R ankle",
  ear:"Ear",eye:"Eye",sh:"Shoulder",hip:"Hip",top:"Head top",floor:"Floor"};
const GENERIC={ear:["rear","lear"],eye:["reye","leye"],sh:["rsh","lsh"],hip:["rhip","lhip"]};

/* Posture views */
const VIEWS={
  anterior:{label:"Anterior",kind:"frontal",front:true,pts:["reye","leye","nose","rsh","lsh","rhip","lhip","rkn","lkn","rank","lank"],
    tip:"Patient faces the camera, feet hip-width, arms relaxed."},
  rlat:{label:"Right lateral",kind:"lateral",facing:1,pts:["rear","rsh","rhip","rkn","rank"],tip:"Right side towards the camera, looking straight ahead."},
  llat:{label:"Left lateral",kind:"lateral",facing:-1,pts:["lear","lsh","lhip","lkn","lank"],tip:"Left side towards the camera, looking straight ahead."},
  posterior:{label:"Posterior",kind:"frontal",front:false,pts:["rear","lear","rsh","lsh","rhip","lhip","rkn","lkn","rank","lank"],
    tip:"Back to the camera, hair off the neck if possible."}
};
const VIEW_ORDER=["anterior","rlat","llat","posterior"];

/* Range of motion tests — typical adult values (AAOS-style) used as the reference */
const ROM=[
  {key:"cfl",region:"Cervical",label:"Flexion",view:"lateral",pts:["ear","eye"],m:"headPitch",dir:1,norm:50,tip:"Side-on. Chin to chest as far as comfortable."},
  {key:"cex",region:"Cervical",label:"Extension",view:"lateral",pts:["ear","eye"],m:"headPitch",dir:-1,norm:60,tip:"Side-on. Look up to the ceiling."},
  {key:"clfL",region:"Cervical",label:"Lateral flexion L",view:"frontal",pts:["reye","leye"],m:"tilt",norm:45,tip:"Facing camera. Left ear towards left shoulder, no shoulder hitch."},
  {key:"clfR",region:"Cervical",label:"Lateral flexion R",view:"frontal",pts:["reye","leye"],m:"tilt",norm:45,tip:"Facing camera. Right ear towards right shoulder."},
  {key:"sflL",region:"Shoulder",label:"Flexion L",view:"lateral",pts:["lhip","lsh","lwr"],m:"angle3",norm:180,tip:"Left side to camera. Raise the straight arm forward and up."},
  {key:"sflR",region:"Shoulder",label:"Flexion R",view:"lateral",pts:["rhip","rsh","rwr"],m:"angle3",norm:180,tip:"Right side to camera. Raise the straight arm forward and up."},
  {key:"sabL",region:"Shoulder",label:"Abduction L",view:"frontal",pts:["lhip","lsh","lwr"],m:"angle3",norm:180,tip:"Facing camera. Raise the left arm out to the side and up."},
  {key:"sabR",region:"Shoulder",label:"Abduction R",view:"frontal",pts:["rhip","rsh","rwr"],m:"angle3",norm:180,tip:"Facing camera. Raise the right arm out to the side and up."},
  {key:"sexL",region:"Shoulder",label:"Extension L",view:"lateral",pts:["lhip","lsh","lwr"],m:"angle3",norm:60,tip:"Left side to camera. Take the straight arm back."},
  {key:"sexR",region:"Shoulder",label:"Extension R",view:"lateral",pts:["rhip","rsh","rwr"],m:"angle3",norm:60,tip:"Right side to camera. Take the straight arm back."},
  {key:"tfl",region:"Thoracolumbar",label:"Flexion",view:"lateral",pts:["hip","sh"],m:"fromVertical",norm:80,tip:"Side-on. Bend forward reaching to the floor, knees straight."},
  {key:"tex",region:"Thoracolumbar",label:"Extension",view:"lateral",pts:["hip","sh"],m:"fromVertical",norm:25,tip:"Side-on. Lean back, hands on hips."},
  {key:"tlfL",region:"Thoracolumbar",label:"Lateral flexion L",view:"frontal",pts:["rsh","lsh","rhip","lhip"],m:"midline",norm:35,tip:"Back to camera. Slide left hand down the left thigh."},
  {key:"tlfR",region:"Thoracolumbar",label:"Lateral flexion R",view:"frontal",pts:["rsh","lsh","rhip","lhip"],m:"midline",norm:35,tip:"Back to camera. Slide right hand down the right thigh."}
];
const ROM_BY=Object.fromEntries(ROM.map(t=>[t.key,t]));
const romName=t=>`${t.region} ${t.label.replace(/^\w/,c=>c.toLowerCase())}`;

/* Screening guide thresholds (degrees): [green below, amber below, otherwise red] */
const TH={tilt:[1.5,3],shift:[1.5,3],fhead:[10,20],ear:[4,8],seg:[3,6]};
const stat=(v,t)=>{const a=Math.abs(v);return a<t[0]?"ok":a<t[1]?"warn":"bad"};
const romStat=p=>p>=.9?"ok":p>=.7?"warn":"bad";
const STAT_WORD={ok:"Within guide",warn:"Mild",bad:"Notable"};

/* ============================================================
   Helpers
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const deg=r=>r*180/Math.PI;
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const f1=v=>(Math.round(v*10)/10).toFixed(1);
const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})}catch(e){return iso}};
const today=()=>new Date().toISOString().slice(0,10);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function armDelete(btn,fn){btn.addEventListener("click",()=>{if(btn.classList.contains("armed")){fn()}else{btn.classList.add("armed");const o=btn.textContent;btn.textContent="Tap again to delete";setTimeout(()=>{btn.classList.remove("armed");btn.textContent=o},3500)}})}

/* ============================================================
   Storage — IndexedDB on this device, with in-memory fallback
   ============================================================ */
const Store={db:null,mem:{patients:new Map(),screens:new Map(),kv:new Map()},ok:false,
  async open(){
    try{
      this.db=await new Promise((res,rej)=>{const r=indexedDB.open("plumbline",1);
        r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("patients",{keyPath:"id"});const s=d.createObjectStore("screens",{keyPath:"id"});s.createIndex("patient","patientId");d.createObjectStore("kv")};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
      this.ok=true;
    }catch(e){this.ok=false}
  },
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  async all(store){if(!this.ok)return[...this.mem[store].values()];try{return await this.tx(store,"readonly",s=>s.getAll())||[]}catch(e){return[]}},
  async get(store,id){if(!this.ok)return this.mem[store].get(id);try{return await this.tx(store,"readonly",s=>s.get(id))}catch(e){return undefined}},
  async put(store,obj,key){if(!this.ok){this.mem[store].set(key??obj.id,obj);return}await this.tx(store,"readwrite",s=>key!==undefined?s.put(obj,key):s.put(obj))},
  async del(store,id){if(!this.ok){this.mem[store].delete(id);return}await this.tx(store,"readwrite",s=>s.delete(id))}
};
let SETTINGS={clinic:"",practitioners:"",hideExample:false};
async function loadSettings(){try{const s=await Store.get("kv","settings");if(s)SETTINGS={...SETTINGS,...s}}catch(e){}}
async function saveSettings(){await Store.put("kv",SETTINGS,"settings")}
async function askPersist(){try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist()}catch(e){}}

/* ============================================================
   Images
   ============================================================ */
const IMG_CACHE=new Map();
function loadImage(src){if(IMG_CACHE.has(src))return IMG_CACHE.get(src);const p=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});IMG_CACHE.set(src,p);return p}
async function fileToDataURL(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("That file isn't an image this browser can open."));i.src=url});
    const max=1400,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.86);
  }finally{URL.revokeObjectURL(url)}
}

/* ============================================================
   Pose detection (MediaPipe Pose, model files published with this page)
   ============================================================ */
const POSE_VER="0.5.1675469404";

function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))])}

/* Default point positions when detection isn't available (fractions of the image) */
const TPL_Y={eye:.11,ear:.12,nose:.14,sh:.25,el:.38,wr:.5,hip:.52,kn:.72,ank:.92};

}

/* Height markers (top of head, floor) used to turn pixels into millimetres */

  const V=VIEWS[viewKey];let head,sh,a,k;

  return{top:{x:head.x,y:Math.max(0,head.y-.55*(sh.y-head.y))},floor:{x:a.x,y:Math.min(H,a.y+.15*(a.y-k.y))}};

/* ============================================================
   Measurements
   ============================================================ */
function sideWord(s){return s==="R"?"right":"left"}
function postureMetrics(viewKey,d,hcm){
  const V=VIEWS[viewKey],P=d&&d.points;if(!P)return[];
  const out=[];const k_=mmScale(P,hcm);const mm=v=>Math.round(Math.abs(v)*k_);
  if(V.kind==="frontal"){

    const plumb=mid(P.rank,P.lank);
    const tilt=(r,l)=>{const a=deg(Math.atan2(Math.abs(r.y-l.y),Math.abs(r.x-l.x)));return{a,low:r.y>l.y?"R":"L",mm:mm(r.y-l.y)}};

    const T=(key,label,r,l)=>{const t=tilt(r,l);out.push({key,label,value:t.a,mm:k_?t.mm:null,text:t.a<.3?"level":k_?`${f1(t.a)}° · ${sideWord(t.low)} ${t.mm} mm low`:`${f1(t.a)}° ${sideWord(t.low)} low`,status:stat(t.a,TH.tilt)})};
    const S=(key,label,p)=>{const s=shift(p);out.push({key,label,value:s.a,mm:k_?s.mm:null,text:s.a<.3||!s.d?"centred":k_?`${f1(s.a)}° · ${s.mm} mm to ${sideWord(s.d)}`:`${f1(s.a)}° to ${sideWord(s.d)}`,status:stat(s.a,TH.shift)})};
    T("headTilt","Head tilt",head.r,head.l); S("headShift","Head shift",head.c);
    T("shTilt","Shoulder level",P.rsh,P.lsh); S("shShift","Shoulder shift",mid(P.rsh,P.lsh));
    T("hipTilt","Pelvic level",P.rhip,P.lhip); S("hipShift","Pelvic shift",mid(P.rhip,P.lhip));
    T("knTilt","Knee level",P.rkn,P.lkn);

    const sgn=(p,base)=>deg(Math.atan2((p.x-base.x)*f,base.y-p.y));
    const off=(p,base)=>mm((p.x-base.x));
    const word=(v,o)=>Math.abs(v)<.3?"on line":k_?`${f1(Math.abs(v))}° · ${o} mm ${v>0?"forward":"back"}`:`${f1(Math.abs(v))}° ${v>0?"forward":"back"}`;

    const e=sgn(ear,ank);out.push({key:"earPl",label:"Ear vs plumb line",value:e,mm:k_?off(ear,ank):null,text:word(e,off(ear,ank)),status:stat(e,TH.ear)});
    const a=sgn(sh,ank);out.push({key:"shPl",label:"Shoulder vs plumb line",value:a,mm:k_?off(sh,ank):null,text:word(a,off(sh,ank)),status:stat(a,TH.seg)});
    const h=sgn(hip,ank);out.push({key:"hipPl",label:"Hip vs plumb line",value:h,mm:k_?off(hip,ank):null,text:word(h,off(hip,ank)),status:stat(h,TH.seg)});
    const k=sgn(kn,ank);out.push({key:"knPl",label:"Knee vs plumb line",value:k,mm:k_?off(kn,ank):null,text:word(k,off(kn,ank)),status:stat(k,TH.seg)});

function romValue(test,d){

/* ============================================================
   Drawing overlays (shared by the editor, comparisons and reports)
   ============================================================ */
function palette(forPrint){
  if(forPrint)return{plumb:"#D2461E",ok:"#2C8A4B",warn:"#B87D00",bad:"#C23A2E",pt:"#0D6680",ptIn:"#FFFFFF",grid:"rgba(255,255,255,.35)",text:"#13212A",halo:"rgba(255,255,255,.85)"};

}
function drawOverlay(ctx,item,d,sc,pal,opt={}){

    const V=VIEWS[item.key],M=Object.fromEntries(postureMetrics(item.key,d).map(m=>[m.key,m]));
    if(V.kind==="frontal"){
      const pl=mid(P.rank,P.lank);
      L({x:pl.x,y:0},{x:pl.x,y:H/sc},pal.plumb,lw,[10,7]);
      const pairs=V.front?[["reye","leye","headTilt"],["rsh","lsh","shTilt"],["rhip","lhip","hipTilt"],["rkn","lkn","knTilt"],["rank","lank",null]]:[["rear","lear","headTilt"],["rsh","lsh","shTilt"],["rhip","lhip","hipTilt"],["rkn","lkn","knTilt"],["rank","lank",null]];

      L(mid(P.rsh,P.lsh),mid(P.rhip,P.lhip),"rgba(255,255,255,.7)",lw*.8);
    }else{
      const s=V.facing===1?"r":"l";const ank=P[s+"ank"];
      L({x:ank.x,y:0},{x:ank.x,y:H/sc},pal.plumb,lw,[10,7]);
      const chain=[s+"ear",s+"sh",s+"hip",s+"kn",s+"ank"];const keys=["fwdHead","shPl","hipPl","knPl"];
      for(let i=0;i<chain.length-1;i++){const m=M[keys[i]];L(P[chain[i]],P[chain[i+1]],colOf(m?m.status:"ok"),lw*1.4)}

    else if(t.m==="tilt"){const [a,b]=t.pts.map(k=>P[k]);const hy=a.y<b.y?a:b;const other=hy===a?b:a;L(hy,{x:other.x,y:hy.y},pal.plumb,lw,[8,6]);L(a,b,col,lw*1.4);labelAt(mid(a,b),r.text)}

  async function placePoints(fresh){
    const d=getData();if(!d||!d.img)return;const im=await loadImage(d.img);
    setStatus("Finding landmarks…");
    const L=await Pose_.detect(im);
    const W=im.naturalWidth,H=im.naturalHeight;
    let P,auto=false;
    if(L&&landmarksOk(def.pts,L)){P=fromLandmarks(def.pts,L);auto=true}
    else P=template(def.pts,def.kind,def.front,W,H);
    if(item.type==="posture")Object.assign(P,calibPoints(item.key,P,W,H));
    const nd={...d,points:P,auto};
    if(item.type==="posture"&&def.kind==="lateral"){let f=VIEWS[item.key].facing;if(L&&L[0]&&auto){const s=VIEWS[item.key].facing===1?"rear":"lear";f=L[0].x>L[MP[s]].x?1:-1}nd.facing=f}
    setData(nd);
    if(auto)setStatus("Landmarks placed automatically. Drag any point to adjust.");
    else setStatus(Pose_.state==="failed"?"Automatic detection isn't available on this device. Drag the points into place.":"Couldn't find the person clearly. Drag the points into place.",true);
    draw();
  }
  function bind(){
    const toImg=e=>{const r=canvas.getBoundingClientRect();const dpr=window.devicePixelRatio||1;return{x:(e.clientX-r.left)*dpr/sc,y:(e.clientY-r.top)*dpr/sc}};
    canvas.addEventListener("pointerdown",e=>{if(readonly)return;const d=getData();if(!d||!d.points)return;const p=toImg(e);
      let best=null,bd=1e9;for(const k of Object.keys(d.points)){const q=d.points[k];const dd=Math.hypot(q.x-p.x,q.y-p.y)*sc/(window.devicePixelRatio||1);if(dd<bd){bd=dd;best=k}}
      if(best&&bd<38){drag={key:best,ox:d.points[best].x-p.x,oy:d.points[best].y-p.y};loupe=e.pointerType!=="mouse";canvas.setPointerCapture(e.pointerId);e.preventDefault();draw()}});
    canvas.addEventListener("pointermove",e=>{if(!drag)return;const d=getData();const p=toImg(e);
      d.points[drag.key]={x:Math.max(0,Math.min(img.naturalWidth,p.x+drag.ox)),y:Math.max(0,Math.min(img.naturalHeight,p.y+drag.oy))};draw()});
    const end=()=>{if(!drag)return;drag=null;loupe=null;setData({...getData(),auto:false});draw()};
    canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);
  }
  if(!readonly){
    const fi=host.querySelector("#edFile");
    fi.addEventListener("change",async()=>{const f=fi.files&&fi.files[0];if(!f)return;
      try{setStatus("Preparing photo…");const url=await fileToDataURL(f);setData({img:url,points:null});canvas=null;
        host.querySelectorAll("#edDetect,#edSwap,#edFace").forEach(b=>b.disabled=false);
        const lbl=fi.closest("label");lbl.lastChild.textContent="Retake photo";await placePoints(true)}
      catch(e){setStatus(e.message||"Couldn't open that photo.",true)}fi.value=""});
    host.querySelector("#edDetect").addEventListener("click",()=>placePoints(false));
    const sw=host.querySelector("#edSwap");if(sw)sw.addEventListener("click",()=>{const d=getData();const P={};for(const k of Object.keys(d.points)){const o=k[0]==="r"?"l"+k.slice(1):k[0]==="l"?"r"+k.slice(1):k;P[o in d.points?o:k]=d.points[k]}setData({...d,points:P});draw();toast("Left and right swapped")});
    const fc=host.querySelector("#edFace");if(fc)fc.addEventListener("click",()=>{const d=getData();setData({...d,facing:-(d.facing||VIEWS[item.key].facing)});draw();toast("Facing direction flipped")});
    const lb=host.querySelector("#edLabels");lb.addEventListener("click",()=>{labels=!labels;lb.setAttribute("aria-pressed",labels);lb.textContent=labels?"Hide point names":"Show point names";draw()});
  }
  const ro=new ResizeObserver(()=>{if(canvas)draw()});ro.observe(stage);
  {const d=getData();if(item.type==="posture"&&d&&d.points&&!d.points.top&&!readonly){loadImage(d.img).then(im=>{Object.assign(d.points,calibPoints(item.key,d.points,im.naturalWidth,im.naturalHeight));setData({...d});draw()})}}
  draw();
  if(getData()&&getData().img)setStatus(getData().auto?"Landmarks placed automatically. Drag any point to adjust.":"Drag any point to adjust.");
  return{redraw:draw,destroy:()=>ro.disconnect()};
}

function figure(kind,o){
  const W=600,H=1000,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#DCE5E8");g.addColorStop(1,"#C5D2D6");x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle="#AEBEC3";x.fillRect(0,950,W,50);
  const skin="#C99A7C",cloth="#2F4A57",short="#40525C";
  const limb=(pts,w,col)=>{x.save();x.strokeStyle=col;x.lineWidth=w;x.lineCap="round";x.lineJoin="round";x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(const p of pts.slice(1))x.lineTo(p.x,p.y);x.stroke();x.restore()};
  const P={};
  if(kind==="front"){
    const cx=300;P.rank={x:cx-45,y:930};P.lank={x:cx+45,y:930};P.rkn={x:cx-50,y:700+(o.knee||0)};P.lkn={x:cx+50,y:700};
    P.rhip={x:cx-68,y:510+o.hip};P.lhip={x:cx+68,y:510};P.rsh={x:cx-105+o.shift,y:262+o.sh};P.lsh={x:cx+105+o.shift,y:262};
    const hx=cx+o.head,hy=128;const t=o.tilt*Math.PI/180;P.reye={x:hx-26*Math.cos(t),y:hy+26*Math.sin(t)};P.leye={x:hx+26*Math.cos(t),y:hy-26*Math.sin(t)};P.nose={x:hx+4*Math.sin(t),y:hy+24};
    limb([P.rank,P.rkn,P.rhip],44,skin);limb([P.lank,P.lkn,P.lhip],44,skin);
    x.fillStyle=short;x.beginPath();x.moveTo(P.rhip.x-16,P.rhip.y-20);x.lineTo(P.lhip.x+16,P.lhip.y-20);x.lineTo(P.lhip.x+20,P.lhip.y+90);x.lineTo(cx+6,P.lhip.y+90);x.lineTo(cx,P.lhip.y+40);x.lineTo(cx-6,P.rhip.y+90);x.lineTo(P.rhip.x-20,P.rhip.y+90);x.fill();
    limb([P.rsh,{x:P.rsh.x-30,y:400},{x:P.rsh.x-38,y:520}],30,skin);limb([P.lsh,{x:P.lsh.x+30,y:400},{x:P.lsh.x+38,y:520}],30,skin);
    x.fillStyle=cloth;x.beginPath();x.moveTo(P.rsh.x-14,P.rsh.y-8);x.lineTo(P.lsh.x+14,P.lsh.y-8);x.lineTo(P.lhip.x+12,P.lhip.y-10);x.lineTo(P.rhip.x-12,P.rhip.y-10);x.closePath();x.fill();
    limb([{x:hx,y:hy+40},{x:cx+o.shift,y:250}],46,skin);
    x.fillStyle=skin;x.beginPath();x.ellipse(hx,hy,50,62,-t,0,Math.PI*2);x.fill();
    x.fillStyle="#3B2A20";x.beginPath();x.ellipse(hx,hy-34,52,32,-t,Math.PI,0);x.fill();
    for(const e of [P.reye,P.leye]){x.fillStyle="#2B1D16";x.beginPath();x.arc(e.x,e.y,5,0,7);x.fill()}
    P.top={x:hx,y:hy-62};P.floor={x:cx,y:950};
  }else{
    const ax=300;P.rank={x:ax,y:930};P.rkn={x:ax+6,y:700};P.rhip={x:ax+o.hipF,y:512};P.rsh={x:ax+o.shF,y:262};P.rear={x:ax+o.earF,y:135};
    limb([{x:ax+40,y:940},{x:ax-20,y:940}],22,"#2B1D16");
    limb([P.rank,P.rkn,P.rhip],48,skin);
    x.fillStyle=short;x.beginPath();x.ellipse(P.rhip.x,P.rhip.y+20,62,80,0,0,7);x.fill();
    limb([P.rhip,P.rsh],96,cloth);
    limb([P.rsh,{x:P.rsh.x+6,y:400},{x:P.rsh.x+14,y:520}],30,skin);
    limb([{x:P.rsh.x-6,y:250},{x:P.rear.x+4,y:170}],44,skin);
    x.fillStyle=skin;x.beginPath();x.ellipse(P.rear.x+14,P.rear.y-6,58,62,0,0,7);x.fill();
    x.fillStyle="#3B2A20";x.beginPath();x.ellipse(P.rear.x-6,P.rear.y-30,56,40,0,Math.PI*.9,Math.PI*2.05);x.fill();
    x.fillStyle="#B07F63";x.beginPath();x.ellipse(P.rear.x,P.rear.y,9,14,0,0,7);x.fill();

function romFigure(angle){
  const W=600,H=1000,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#DCE5E8");g.addColorStop(1,"#C5D2D6");x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle="#AEBEC3";x.fillRect(0,950,W,50);
  const skin="#C99A7C",cloth="#2F4A57";const limb=(pts,w,col)=>{x.save();x.strokeStyle=col;x.lineWidth=w;x.lineCap="round";x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(const p of pts.slice(1))x.lineTo(p.x,p.y);x.stroke();x.restore()};
  const hip={x:280,y:560},sh={x:284,y:320};const a=angle*Math.PI/180;const wr={x:sh.x+250*Math.sin(a),y:sh.y+250*Math.cos(a)};

async function patients(){const ps=await Store.all("patients");ps.sort((a,b)=>a.name.localeCompare(b.name));if(!SETTINGS.hideExample&&EXAMPLE)ps.unshift(EXAMPLE.patient);return ps}
async function getPatient(id){return id==="example"?EXAMPLE.patient:await Store.get("patients",id)}
async function screensOf(pid){if(pid==="example")return EXAMPLE.screens.slice();const all=await Store.all("screens");return all.filter(s=>s.patientId===pid).sort((a,b)=>a.date.localeCompare(b.date)||(a.created||"").localeCompare(b.created||""))}
async function getScreen(id){if(id&&id.startsWith("ex"))return EXAMPLE.screens.find(s=>s.id===id);return await Store.get("screens",id)}
function screenSummary(s){const all=[];for(const k of VIEW_ORDER){const d=s.views&&s.views[k];if(d&&d.points)all.push(...postureMetrics(k,d))}
  for(const t of ROM){const d=s.rom&&s.rom[t.key];if(d&&d.points)all.push(romValue(t,d))}
  return{bad:all.filter(m=>m.status==="bad").length,warn:all.filter(m=>m.status==="warn").length,n:all.length}}

function lsGet(k){try{return localStorage.getItem("pl_"+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("pl_"+k,v)}catch(e){}}
function allMetricRows(ss){
  const rows=[];
  for(const k of VIEW_ORDER){const keys=new Map();for(const s of ss){const d=s.views&&s.views[k];if(d&&d.points)for(const m of postureMetrics(k,d))keys.set(m.key,m.label)}
    for(const [mk,label] of keys)rows.push({group:VIEWS[k].label,label,get:s=>{const d=s.views&&s.views[k];if(!d||!d.points)return null;const m=postureMetrics(k,d,s.heightCm).find(x=>x.key===mk);return m?{v:Math.abs(m.value),t:`${f1(Math.abs(m.value))}°${m.mm!=null?` · ${m.mm} mm`:""}`,s:m.status}:null}})}
  for(const t of ROM){if(ss.some(s=>s.rom&&s.rom[t.key]&&s.rom[t.key].points))rows.push({group:`${t.region} ROM`,label:t.label,rom:true,get:s=>{const d=s.rom&&s.rom[t.key];if(!d||!d.points)return null;const r=romValue(t,d);return{v:r.value,t:`${Math.round(r.value)}°`,s:r.status}}})}
  return rows;
}
function trendTable(ss){
  const cols=ss.slice(-6);const rows=allMetricRows(cols);let g="";
  return `<table><thead><tr><th>Measure</th>${cols.map(s=>`<th class="num">${esc(fmtDate(s.date))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>{
    const head=r.group!==g?(g=r.group,`<tr><td colspan="${cols.length+1}" class="label" style="padding-top:14px">${esc(r.group)}</td></tr>`):"";
    return head+`<tr><td>${esc(r.label)}</td>${cols.map(s=>{const c=r.get(s);return `<td class="v">${c?`<span class="dot ${c.s}"></span>${esc(c.t)}`:`<span class="muted">–</span>`}</td>`}).join("")}</tr>`}).join("")}</tbody></table>`;
}

function changeCell(a,b,rom){if(!a||!b)return`<td class="muted">–</td>`;const d=b.v-a.v;if(Math.abs(d)<.5)return`<td class="v muted">no change</td>`;const better=rom?d>0:d<0;return `<td class="v ${better?"up":"down"}">${d>0?"+":"−"}${f1(Math.abs(d))}° ${better?"better":"worse"}</td>`}
function compareTable(cur,A,B){
  const rows=allMetricRows([A,B]).filter(r=>cur.type==="posture"?r.group===VIEWS[cur.key].label:r.label===ROM_BY[cur.key].label&&r.group===`${ROM_BY[cur.key].region} ROM`);
  return `<table><thead><tr><th>Measure</th><th>Before</th><th>After</th><th>Change</th></tr></thead><tbody>${rows.map(r=>{const a=r.get(A),b=r.get(B);return `<tr><td>${esc(r.label)}</td><td class="v">${a?`<span class="dot ${a.s}"></span>${a.t}`:"–"}</td><td class="v">${b?`<span class="dot ${b.s}"></span>${b.t}`:"–"}</td>${changeCell(a,b,r.rom)}</tr>`}).join("")}</tbody></table>`;
}
function fullCompareTable(A,B){const rows=allMetricRows([A,B]);let g="";
  return `<table><thead><tr><th>Measure</th><th>${esc(fmtDate(A.date))}</th><th>${esc(fmtDate(B.date))}</th><th>Change</th></tr></thead><tbody>${rows.map(r=>{const a=r.get(A),b=r.get(B);
    const head=r.group!==g?(g=r.group,`<tr><td colspan="4" class="label" style="padding-top:14px">${esc(r.group)}</td></tr>`):"";
    return head+`<tr><td>${esc(r.label)}</td><td class="v">${a?`<span class="dot ${a.s}"></span>${a.t}`:"–"}</td><td class="v">${b?`<span class="dot ${b.s}"></span>${b.t}`:"–"}</td>${changeCell(a,b,r.rom)}</tr>`}).join("")}</tbody></table>`}

/* ============================================================
   Files out (downloads capability)
   ============================================================ */
async function saveFile(name,blob,statusEl){
  statusEl.classList.remove("warnmsg");
  const type=name.endsWith(".pdf")?"application/pdf":"application/json";
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});return true;
    }
  }catch(e){if(e&&e.name==="AbortError"){statusEl.textContent="Cancelled.";return false}}
  try{
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);return true;
  }catch(e){statusEl.textContent="Couldn't save the file on this device.";statusEl.classList.add("warnmsg");return false}
}

/* ============================================================
   PDF reports
   ============================================================ */
async function makeReport(screens,p,statusEl){
  if(!window.jspdf){statusEl.textContent="The PDF tool didn't load. Check the connection and reload.";statusEl.classList.add("warnmsg");return}
  statusEl.classList.remove("warnmsg");statusEl.textContent="Building report…";
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
  const M=14,PW=210,PH=297,CW=PW-2*M;let y=M;
  const COL={ok:[44,138,75],warn:[184,125,0],bad:[194,58,46],ink:[19,33,42],muted:[86,104,114],line:[203,214,218],accent:[13,102,128],plumb:[210,70,30]};
  const progress=screens.length===2;const [A,B]=screens;
  const footer=()=>{const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(...COL.muted);
    doc.text("Screening aid only. Photo-based measurements are estimates and are not a diagnosis.",M,PH-8);doc.text(`Page ${i} of ${n}`,PW-M,PH-8,{align:"right"})}};
  const need=h=>{if(y+h>PH-16){doc.addPage();y=M}};
  const h2=t=>{need(12);doc.setFont("helvetica","bold");doc.setFontSize(12.5);doc.setTextColor(...COL.ink);doc.text(t,M,y+5);y+=9};
  // header
  doc.setFillColor(...COL.plumb);doc.rect(M,y,1.2,16,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(...COL.ink);doc.text(SETTINGS.clinic||"Posture screening",M+5,y+6);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...COL.muted);doc.text(progress?"Progress report: posture and range of motion":"Posture and range of motion screening report",M+5,y+12);
  y+=22;
  doc.setFontSize(10);doc.setTextColor(...COL.ink);
  const info=[["Patient",p.name],["Date of birth",p.dob?fmtDate(p.dob):"–"],progress?["Screenings",`${fmtDate(A.date)} and ${fmtDate(B.date)}`]:["Date",fmtDate(A.date)],["Practitioner",(progress?B:A).practitioner||"–"]];
  if((progress?B:A).heightCm)info.push(["Height",`${(progress?B:A).heightCm} cm`]);
  info.forEach(([k,val],i)=>{const x=M+(i%2)*(CW/2),yy=y+Math.floor(i/2)*6;doc.setFont("helvetica","bold");doc.text(k+":",x,yy);doc.setFont("helvetica","normal");doc.text(String(val),x+28,yy)});
  y+=6*Math.ceil(info.length/2)+2;doc.setDrawColor(...COL.line);doc.line(M,y,PW-M,y);y+=6;
  const dot=(x,yy,s)=>{doc.setFillColor(...(COL[s]||COL.line));doc.circle(x,yy-1.2,1.3,"F")};
  // posture
  const views=VIEW_ORDER.filter(k=>screens.every(s=>s.views&&s.views[k]&&s.views[k].points));
  if(views.length){h2("Posture");
    for(const k of views){
      const item={type:"posture",key:k};
      if(progress){
        need(120);doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text(VIEWS[k].label,M,y+4);y+=7;
        const imgs=[];for(const s of screens)imgs.push(await renderAnnotated(item,s.views[k],700,1000,true));
        const w=40;let maxh=0;imgs.forEach((c,i)=>{const h=w*c.height/c.width;maxh=Math.max(maxh,h);doc.addImage(c.toDataURL("image/jpeg",.85),"JPEG",M+i*(w+4),y,w,h);doc.setFontSize(7.5);doc.setTextColor(...COL.muted);doc.text(fmtDate(screens[i].date),M+i*(w+4),y+h+4)});
        const mA=postureMetrics(k,A.views[k],A.heightCm),mB=postureMetrics(k,B.views[k],B.heightCm);let ty=y+2;const tx=M+2*w+12;
        doc.setFontSize(7.5);doc.setTextColor(...COL.muted);doc.setFont("helvetica","bold");doc.text("Measure",tx,ty);doc.text("Before",tx+50,ty);doc.text("After",tx+76,ty);doc.text("Change",tx+102,ty);ty+=5;
        doc.setFont("helvetica","normal");doc.setFontSize(8.5);
        mA.forEach((ma,i)=>{const mb=mB[i];doc.setTextColor(...COL.ink);doc.text(ma.label,tx,ty);dot(tx+48,ty,ma.status);doc.text(`${f1(Math.abs(ma.value))}°${ma.mm!=null?` ${ma.mm}mm`:""}`,tx+50.5,ty);dot(tx+74,ty,mb.status);doc.text(`${f1(Math.abs(mb.value))}°${mb.mm!=null?` ${mb.mm}mm`:""}`,tx+76.5,ty);
          const d=Math.abs(mb.value)-Math.abs(ma.value);if(Math.abs(d)<.5){doc.setTextColor(...COL.muted);doc.text("no change",tx+102,ty)}else{doc.setTextColor(...(d<0?COL.ok:COL.bad));doc.text(`${d>0?"+":"-"}${f1(Math.abs(d))}° ${d<0?"better":"worse"}`,tx+102,ty)}ty+=5.2});
        y+=Math.max(maxh+8,ty-y)+4;
      }else{
        need(95);const c=await renderAnnotated(item,A.views[k],700,1000,true);const w=55,h=Math.min(90,w*c.height/c.width),ww=h*c.width/c.height;
        doc.addImage(c.toDataURL("image/jpeg",.85),"JPEG",M,y,ww,h);
        const tx=M+ww+8;let ty=y+4;doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(...COL.ink);doc.text(VIEWS[k].label,tx,ty);ty+=7;
        doc.setFontSize(9);for(const m of postureMetrics(k,A.views[k],A.heightCm)){doc.setFont("helvetica","normal");doc.setTextColor(...COL.ink);doc.text(m.label,tx,ty);dot(tx+64,ty,m.status);doc.text(m.text,tx+67,ty);ty+=6}
        y+=h+6;
      }
    }
  }
  // ROM
  const roms=ROM.filter(t=>screens.every(s=>s.rom&&s.rom[t.key]&&s.rom[t.key].points));
  if(roms.length){h2("Range of motion");
    doc.setFontSize(8);doc.setFont("helvetica","bold");doc.setTextColor(...COL.muted);
    const cx=progress?[M,M+70,M+98,M+126,M+150]:[M,M+80,M+110,M+140];
    (progress?["Test","Before","After","Typical","Change"]:["Test","Measured","Typical","% of typical"]).forEach((t,i)=>doc.text(t,cx[i],y));y+=5;
    doc.setFont("helvetica","normal");doc.setFontSize(9);
    for(const t of roms){need(7);const ra=romValue(t,A.rom[t.key]);doc.setTextColor(...COL.ink);doc.text(`${romName(t)}`,cx[0],y);
      if(progress){const rb=romValue(t,B.rom[t.key]);dot(cx[1]-2.5,y,ra.status);doc.text(`${Math.round(ra.value)}°`,cx[1],y);dot(cx[2]-2.5,y,rb.status);doc.text(`${Math.round(rb.value)}°`,cx[2],y);doc.text(`${t.norm}°`,cx[3],y);
        const d=rb.value-ra.value;if(Math.abs(d)<.5){doc.setTextColor(...COL.muted);doc.text("no change",cx[4],y)}else{doc.setTextColor(...(d>0?COL.ok:COL.bad));doc.text(`${d>0?"+":"-"}${Math.round(Math.abs(d))}° ${d>0?"better":"worse"}`,cx[4],y)}}
      else{dot(cx[1]-2.5,y,ra.status);doc.text(`${Math.round(ra.value)}°`,cx[1],y);doc.text(`${t.norm}°`,cx[2],y);doc.text(`${Math.round(ra.pct*100)}%`,cx[3],y)}
      y+=6.2}
    y+=3;
  }
  // legend + notes
  need(10);doc.setFontSize(8);doc.setTextColor(...COL.muted);let lx=M;for(const [s,w] of [["ok","Within guide"],["warn","Mild"],["bad","Notable"]]){dot(lx+1.3,y+1,s);doc.text(w,lx+4,y+1);lx+=30}y+=8;
  const notes=(progress?B:A).notes;if(notes){h2("Notes");doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...COL.ink);const lines=doc.splitTextToSize(notes,CW);for(const ln of lines){need(5.5);doc.text(ln,M,y);y+=5.2}}
  footer();
  const blob=doc.output("blob");const fname=`${p.name} ${progress?"progress":"screening"} ${(progress?B:A).date}.pdf`;
  const ok=await saveFile(fname,blob,statusEl);if(ok){statusEl.classList.remove("warnmsg");statusEl.textContent="Report ready. Use the share sheet to print, email or save it to Files."}
}

/* ============================================================
   Start
   ============================================================ */
(async function start(){
  await Store.open();await loadSettings();buildExample();render();
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
  askPersist();
  // warm the pose model in the background so the first photo is quick
  setTimeout(()=>Pose_.init(),1500);
})();
</script>
</body>
